<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Pimmelprinzen - Mannschaftskasse</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-inner: #111827;
            --card-border: #334155;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 25px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        .header h1 {
            font-size: 26px;
            color: var(--accent);
            margin: 0 0 5px 0;
            font-weight: 700;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(248, 250, 252, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-toggle-btn.active {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            margin: 25px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .controls-box {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls-box label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .date-input {
            background: #1f2937;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }
        .matchday-sum {
            font-weight: 700;
            color: var(--accent);
            font-size: 15px;
        }

        .player-row-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-name-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid currentColor;
        }

        .inputs-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .amount-select {
            background: #1f2937;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
        }
        .amount-select:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: #111827;
        }
        .amount-select:focus { border-color: var(--accent); }

        .total-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            min-width: 75px;
            text-align: right;
        }

        .due-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .due-input-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .due-input {
            background: #1e293b;
            border: 2px solid var(--accent);
            color: #ffffff;
            padding: 8px 36px 8px 14px;
            border-radius: 10px;
            width: 130px;
            font-family: inherit;
            font-size: 16px;
            text-align: right;
            outline: none;
            font-weight: 700;
        }
        .due-input:disabled {
            opacity: 0.9;
            cursor: not-allowed;
            background: #111827;
            border-color: var(--card-border);
            color: #f8fafc;
        }
        .due-input:focus { 
            border-color: #f59e0b; 
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }
        .currency-symbol {
            position: absolute;
            right: 12px;
            color: var(--accent);
            font-weight: 700;
            font-size: 16px;
            pointer-events: none;
        }

        .stats-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .stats-values {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .stats-total {
            font-weight: 700;
            color: var(--accent);
            font-size: 15px;
        }

        .p-MetalBoller { background-color: rgba(2, 136, 209, 0.15); color: #29b6f6; }
        .p-Daszebra { background-color: rgba(123, 31, 162, 0.15); color: #ba68c8; }
        .p-Günni { background-color: rgba(56, 142, 60, 0.15); color: #66bb6a; }
        .p-HerrProfessor { background-color: rgba(245, 124, 0, 0.15); color: #ffa726; }
        .p-Pepe { background-color: rgba(211, 47, 47, 0.15); color: #ef5350; }
        .p-Libero { background-color: rgba(0, 121, 107, 0.15); color: #26a69a; }
        .p-Illie { background-color: rgba(113, 113, 113, 0.15); color: #cfd8dc; }

        .footer-nav { text-align: center; margin-top: 30px; }
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(248, 250, 252, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-back:hover { background: rgba(248, 250, 252, 0.15); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button id="adminBtn" class="admin-toggle-btn" onclick="toggleAdminMode()">🔒 Admin</button>
        <h1>👑 Pimmelprinzen</h1>
        <p>Mannschaftskasse & Auswertung</p>
    </div>

    <!-- SPIELTAG STEUERUNG -->
    <div class="section-title">Spieltag Erfassung</div>
    <div class="controls-box">
        <div>
            <label for="matchDate">Spieltag Datum:</label><br>
            <input type="date" id="matchDate" class="date-input" onchange="loadMatchdayData()">
        </div>
        <div style="text-align: right;">
            <label>Spieltag-Summe:</label><br>
            <span class="matchday-sum" id="matchdayTotalSum">0,00 €</span>
        </div>
    </div>

    <!-- SPIELTAG LISTE -->
    <div id="playerCardList"></div>

    <!-- OFFENE POSTEN -->
    <div class="section-title">Offene Beiträge</div>
    <div id="dueCardList"></div>

    <!-- GESAMTAUSWERTUNG -->
    <div class="section-title">Gesamtauswertung pro Spieler</div>
    <div id="statsCardList"></div>
    
</div>

<script>
    const SUPABASE_URL = 'https://lhusylpjnujlqomougmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yXEueWILvAq-Vm2VfTuYyg_BIQeE1KK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const players = [
        { name: "MetalBoller", css: "p-MetalBoller" },
        { name: "Daszebra", css: "p-Daszebra" },
        { name: "Günni", css: "p-Günni" },
        { name: "HerrProfessor", css: "p-HerrProfessor" },
        { name: "Pepe", css: "p-Pepe" },
        { name: "Libero", css: "p-Libero" },
        { name: "Illie", css: "p-Illie" }
    ];

    // Zuverlässige Ermittlung des letzten Donnerstags (Donnerstag = 4)
    function getLatestThursday() {
        const d = new Date();
        const day = d.getDay(); // 0=So, 1=Mo, 2=Di, 3=Mi, 4=Do, 5=Fr, 6=Sa
        let diff = (day >= 4) ? (day - 4) : (7 - (4 - day));
        d.setDate(d.getDate() - diff);
        return d.toISOString().split('T')[0];
    }

    let currentMatchDate = getLatestThursday();
    let kasseRecords = [];
    let dueRecords = {};
    let isAdmin = false;

    const ADMIN_PASSWORD = "pimmelkasse123"; 

    function toggleAdminMode() {
        if (!isAdmin) {
            const pwd = prompt("Bitte Admin-Passwort eingeben:");
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                alert("Admin-Modus aktiviert!");
            } else if (pwd !== null) {
                alert("Falsches Passwort!");
                return;
            } else {
                return;
            }
        } else {
            isAdmin = false;
            alert("Admin-Modus gesperrt.");
        }

        const btn = document.getElementById('adminBtn');
        if (isAdmin) {
            btn.textContent = "🔓 Admin Aktiv";
            btn.classList.add('active');
        } else {
            btn.textContent = "🔒 Admin";
            btn.classList.remove('active');
        }
        updateUI();
    }

    function generateAmountOptions(selectedValue) {
        let options = '';
        for (let i = 0; i <= 30; i++) {
            let val = (i * 0.5).toFixed(2);
            let selected = Math.abs(parseFloat(val) - parseFloat(selectedValue)) < 0.01 ? 'selected' : '';
            options += `<option value="${val}" ${selected}>${val.replace('.', ',')} €</option>`;
        }
        return options;
    }

    async function initApp() {
        document.getElementById('matchDate').value = currentMatchDate;
        await fetchAllKasseData();
        await fetchDueData();
    }

    async function fetchAllKasseData() {
        try {
            const { data, error } = await supabaseClient.from('mannschaftskasse').select('*');
            if (error) throw error;
            kasseRecords = data || [];
            updateUI();
        } catch (err) {
            console.error("Fehler beim Laden:", err);
            kasseRecords = [];
            updateUI();
        }
    }

    async function fetchDueData() {
        try {
            const { data, error } = await supabaseClient.from('mannschaftskasse_offen').select('*');
            if (error) throw error;
            dueRecords = {};
            if (data) {
                data.forEach(r => { dueRecords[r.spieler] = parseFloat(r.offener_betrag) || 0; });
            }
            renderDueList();
        } catch (err) {
            console.error("Fehler beim Laden der offenen Posten:", err);
            renderDueList();
        }
    }

    async function updateDueRecord(player, rawValue) {
        if (!isAdmin) return;
        const cleanedValue = rawValue.replace(',', '.');
        const val = parseFloat(cleanedValue) || 0;
        dueRecords[player] = val;
        try {
            await supabaseClient.from('mannschaftskasse_offen').upsert({
                spieler: player,
                offener_betrag: val,
                updated_at: new Date()
            }, { onConflict: 'spieler' });
        } catch (err) {
            console.error("Fehler beim Speichern:", err);
        }
    }

    async function updateRecord(player, fixBeitrag, verlorenBetrag) {
        if (!isAdmin) return;
        currentMatchDate = document.getElementById('matchDate').value;
        const fix = parseFloat(fixBeitrag) || 5.00;
        const verloren = parseFloat(verlorenBetrag) || 0.00;
        
        try {
            await supabaseClient.from('mannschaftskasse').upsert({
                spieltag_datum: currentMatchDate,
                spieler: player,
                fix_beitrag: fix,
                verloren_betrag: verloren,
                updated_at: new Date()
            }, { onConflict: 'spieltag_datum,spieler' });
            
            const index = kasseRecords.findIndex(r => r.spieltag_datum === currentMatchDate && r.spieler === player);
            if (index !== -1) {
                kasseRecords[index].fix_beitrag = fix;
                kasseRecords[index].verloren_betrag = verloren;
            } else {
                kasseRecords.push({ spieltag_datum: currentMatchDate, spieler: player, fix_beitrag: fix, verloren_betrag: verloren });
            }
            updateUI();
        } catch (err) {
            console.error("Fehler beim Speichern:", err);
        }
    }

    function updateUI() {
        renderMatchdayCards();
        renderDueList();
        renderStatsCards();
    }

    function renderMatchdayCards() {
        currentMatchDate = document.getElementById('matchDate').value;
        const container = document.getElementById('playerCardList');
        container.innerHTML = '';
        let matchdayTotal = 0;

        let matchdayPlayers = players.map(p => {
            const record = kasseRecords.find(r => r.spieltag_datum === currentMatchDate && r.spieler === p.name);
            const fix = record ? parseFloat(record.fix_beitrag) : 5.00;
            const verloren = record ? parseFloat(record.verloren_betrag) : 0.00;
            return { ...p, fix, verloren, gesamt: fix + verloren };
        });

        matchdayPlayers.sort((a, b) => a.gesamt - b.gesamt);

        matchdayPlayers.forEach(p => {
            matchdayTotal += p.gesamt;
            const card = document.createElement('div');
            card.className = 'player-row-card';
            card.innerHTML = `
                <span class="player-name-badge ${p.css}">${p.name}</span>
                <div class="inputs-group">
                    <span style="font-size: 12px; color: var(--text-muted);">Fix 5€ +</span>
                    <select class="amount-select" ${isAdmin ? '' : 'disabled'} onchange="updateRecord('${p.name}', 5.00, this.value)">
                        ${generateAmountOptions(p.verloren)}
                    </select>
                    <div class="total-badge">${p.gesamt.toFixed(2).replace('.', ',')} €</div>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('matchdayTotalSum').textContent = matchdayTotal.toFixed(2).replace('.', ',') + ' €';
    }

    function renderDueList() {
        const container = document.getElementById('dueCardList');
        container.innerHTML = '';

        let duePlayers = players.map(p => {
            const dueVal = dueRecords[p.name] !== undefined ? dueRecords[p.name] : 0.00;
            return { ...p, dueVal };
        });

        duePlayers.sort((a, b) => a.dueVal - b.dueVal);

        duePlayers.forEach(p => {
            const formattedVal = p.dueVal.toFixed(2).replace('.', ',');
            const card = document.createElement('div');
            card.className = 'due-card';
            card.innerHTML = `
                <span class="player-name-badge ${p.css}">${p.name}</span>
                <div class="due-input-wrapper">
                    <input type="text" class="due-input" ${isAdmin ? '' : 'disabled'} 
                        value="${formattedVal}" 
                        onchange="updateDueRecord('${p.name}', this.value)" 
                        onblur="this.value = parseFloat(this.value.replace(',', '.') || 0).toFixed(2).replace('.', ',')"
                        placeholder="0,00">
                    <span class="currency-symbol">€</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderStatsCards() {
        const container = document.getElementById('statsCardList');
        container.innerHTML = '';

        const now = new Date();
        const currentYearMonth = now.toISOString().slice(0, 7);

        let statsData = players.map(p => {
            let sumTotal = 0;
            let monthTotal = 0;
            const playerMonths = new Set();

            kasseRecords.forEach(r => {
                if (r.spieler === p.name) {
                    const spielGesamt = parseFloat(r.fix_beitrag || 5) + parseFloat(r.verloren_betrag || 0);
                    sumTotal += spielGesamt;

                    if (r.spieltag_datum) {
                        const m = r.spieltag_datum.slice(0, 7);
                        playerMonths.add(m);
                        if (m === currentYearMonth) {
                            monthTotal += spielGesamt;
                        }
                    }
                }
            });

            const playerMonthsCount = Math.max(1, playerMonths.size);
            const playerMonthlyAvg = sumTotal / playerMonthsCount;

            return { ...p, sumTotal, monthTotal, playerMonthlyAvg };
        });

        statsData.sort((a, b) => a.sumTotal - b.sumTotal);

        statsData.forEach(p => {
            const card = document.createElement('div');
            card.className = 'stats-card';
            card.innerHTML = `
                <span class="player-name-badge ${p.css}">${p.name}</span>
                <div class="stats-values">
                    <span>Diesen Monat: <strong style="color: var(--success);">${p.monthTotal.toFixed(2).replace('.', ',')} €</strong></span>
                    <span>Monatsschnitt: <strong style="color: var(--text-main);">${p.playerMonthlyAvg.toFixed(2).replace('.', ',')} €</strong></span>
                </div>
                <div class="stats-total">${p.sumTotal.toFixed(2).replace('.', ',')} €</div>
            `;
            container.appendChild(card);
        });
    }

    function loadMatchdayData() {
        renderMatchdayCards();
    }

    window.onload = initApp;
</script>
</body>
</html>
